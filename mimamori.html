<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>みまもり</title>
<style>
  :root{
    --ink:#0b1020;        /* 夜の壁 */
    --ink-2:#141b31;      /* パネル */
    --line:#25304f;       /* 罫 */
    --text:#e7e3d8;       /* 温白 */
    --mute:#8894b4;       /* 補助文字 */
    --amber:#e8a13a;      /* 常夜灯の色 = 主アクセント */
    --amber-dim:#7a5a22;
    --alive:#5fd39a;      /* 接続中 */
    --alarm:#e2604a;      /* 切断 */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    font-size:16px;line-height:1.7;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow:hidden;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

  /* ---------- 画面共通 ---------- */
  .screen{display:none;flex:1;flex-direction:column;min-height:0}
  .screen.on{display:flex}
  .wrap{width:100%;max-width:520px;margin:0 auto;padding:28px 22px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px}

  .eyebrow{font-size:12px;letter-spacing:.22em;color:var(--amber);text-transform:uppercase}
  h1{font-size:30px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
  h1 small{display:block;font-size:14px;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:8px}

  .card{
    background:var(--ink-2);border:1px solid var(--line);border-radius:14px;
    padding:20px;display:flex;flex-direction:column;gap:12px;
    text-align:left;width:100%;color:inherit;font:inherit;cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .card:hover,.card:focus-visible{border-color:var(--amber);transform:translateY(-2px)}
  .card:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  .card .role{font-size:19px;font-weight:600}
  .card .desc{font-size:13.5px;color:var(--mute);line-height:1.6}

  button{font:inherit}
  .btn{
    background:var(--amber);color:#1b1206;border:0;border-radius:11px;
    padding:15px 20px;font-size:16px;font-weight:600;width:100%;cursor:pointer;
  }
  .btn:focus-visible{outline:2px solid var(--text);outline-offset:3px}
  .btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
  .btn:disabled{opacity:.45;cursor:default}

  label{font-size:13px;color:var(--mute);display:block;margin-bottom:7px}
  input[type=text]{
    width:100%;background:#0d1327;border:1px solid var(--line);
    border-radius:11px;padding:15px;color:var(--text);font-size:20px;letter-spacing:.16em;
    text-align:center;text-transform:uppercase;
  }
  input[type=text]:focus{outline:none;border-color:var(--amber)}

  .status{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--mute)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none}
  .dot.ok{background:var(--alive)}
  .dot.bad{background:var(--alarm)}

  .note{font-size:12.5px;color:var(--mute);line-height:1.75;border-left:2px solid var(--amber-dim);padding-left:12px}

  /* ---------- カメラ側：消灯モード ---------- */
  #camScreen{background:#000}
  #darkveil{
    position:fixed;inset:0;background:#000;z-index:50;
    display:none;align-items:center;justify-content:center;
  }
  #darkveil.on{display:flex}
  /* 署名：ほぼ真っ暗な画面に、呼吸する小さな灯りひとつ。
     育児室に光を撒かないための設計 */
  #breath{
    width:7px;height:7px;border-radius:50%;background:var(--amber);
    opacity:.22;animation:breathe 5s ease-in-out infinite;
  }
  #breath.bad{background:var(--alarm);opacity:.5;animation-duration:1.1s}
  @keyframes breathe{0%,100%{opacity:.08;transform:scale(.8)}50%{opacity:.32;transform:scale(1)}}
  #veilhint{
    position:fixed;bottom:34px;left:0;right:0;text-align:center;
    font-size:12px;color:#2f3a56;
  }

  /* ---------- モニター側 ---------- */
  #monScreen{background:#000}
  #stage{flex:1;position:relative;min-height:0;background:#000}
  video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  #bar{
    position:absolute;left:0;right:0;bottom:0;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent,rgba(0,0,0,.85) 45%);
    display:flex;align-items:center;gap:14px;
  }
  /* 音量メーター：夜は画面を見ずに音で判断したいので、音を「目に見える」形に */
  #meter{flex:1;height:5px;background:#1d2540;border-radius:3px;overflow:hidden}
  #meterFill{height:100%;width:0%;background:var(--alive);transition:width .08s linear}
  #meterFill.loud{background:var(--amber)}
  #topbar{
    position:absolute;top:0;left:0;right:0;padding:12px 16px;
    background:linear-gradient(rgba(0,0,0,.8),transparent);
    display:flex;align-items:center;gap:9px;font-size:13px;color:var(--mute);
  }
  .iconbtn{background:rgba(255,255,255,.08);border:0;color:var(--text);border-radius:9px;padding:9px 13px;font-size:13px;cursor:pointer}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<!-- ===== 1. 役割選択 ===== -->
<section id="pickScreen" class="screen on">
  <div class="wrap">
    <div>
      <p class="eyebrow">Mimamori</p>
      <h1>この端末の役割を選ぶ<small>2台とも、同じこのページを開いてください。</small></h1>
    </div>

    <button class="card" id="pickCam">
      <span class="role">カメラにする</span>
      <span class="desc">ベビーベッドに向けて置く側。映像と音を送ります。画面は自動で真っ暗になります。</span>
    </button>

    <button class="card" id="pickMon">
      <span class="role">見る側にする</span>
      <span class="desc">手元で見る側。カメラ側に表示された6文字のコードを入力します。</span>
    </button>

    <p class="note">映像は端末どうしで直接やり取りされ、録画も保存もされません。広告もありません。</p>
  </div>
</section>

<!-- ===== 2. カメラ側 ===== -->
<section id="camScreen" class="screen">
  <div class="wrap">
    <div>
      <p class="eyebrow">カメラ</p>
      <h1>この番号を、見る側に入力<small>ページを閉じると接続が切れます。</small></h1>
    </div>

    <div class="card" style="cursor:default;align-items:center;gap:6px">
      <div class="mono" id="roomCode" style="font-size:44px;letter-spacing:.22em;color:var(--amber)">------</div>
      <div class="status"><span class="dot" id="camDot"></span><span id="camStat">カメラを準備しています</span></div>
    </div>

    <button class="btn" id="camSwitch">前後のカメラを切り替える</button>
    <button class="btn ghost" id="camDark">画面を消して見守りを始める</button>

    <p class="note">画面を消したあとも動き続けます。<br>端末の明るさは手動で最小にしてください（ブラウザからは変更できません）。</p>
  </div>

  <div id="darkveil">
    <div id="breath"></div>
    <div id="veilhint">画面を2回タップすると戻ります</div>
  </div>
</section>

<!-- ===== 3. 見る側：コード入力 ===== -->
<section id="joinScreen" class="screen">
  <div class="wrap">
    <div>
      <p class="eyebrow">見る側</p>
      <h1>カメラの番号を入力<small>カメラ側の画面に出ている6文字です。</small></h1>
    </div>
    <div>
      <label for="codeIn">接続コード</label>
      <input type="text" id="codeIn" class="mono" maxlength="6" placeholder="ABC123"
             autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
    </div>
    <button class="btn" id="joinGo">つなぐ</button>
    <div class="status"><span class="dot" id="joinDot"></span><span id="joinStat">待機中</span></div>
  </div>
</section>

<!-- ===== 4. 見る側：映像 ===== -->
<section id="monScreen" class="screen">
  <div id="stage">
    <video id="remote" playsinline autoplay></video>
    <div id="topbar">
      <span class="dot" id="monDot"></span><span id="monStat">接続中</span>
    </div>
    <div id="bar">
      <button class="iconbtn" id="muteBtn">音を消す</button>
      <div id="meter"><div id="meterFill"></div></div>
      <button class="iconbtn" id="endBtn">終了</button>
    </div>
  </div>
</section>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";

const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $(id).classList.add('on');
};

/* 紛らわしい文字（0 O 1 I）を除いた6桁コード */
const ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const makeCode = () => Array.from(crypto.getRandomValues(new Uint8Array(6)))
  .map(n => ALPHABET[n % ALPHABET.length]).join("");

/* PeerJSの共有サーバーは世界共通の名前空間なので、必ず接頭辞を付けて衝突を避ける */
const NS = "mimamori-v1-";

let wakeLock = null;
async function keepAwake(){
  try{
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
      document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState === "visible" && !wakeLock) {
          try { wakeLock = await navigator.wakeLock.request("screen"); } catch(e){}
        }
      });
    }
  }catch(e){ /* 非対応端末では何もしない */ }
}

/* ================= カメラ側 ================= */
let camStream = null, camPeer = null, facing = "environment", viewers = new Map();

async function startCamera(){
  show("camScreen");
  const code = makeCode();
  $("roomCode").textContent = code;
  await keepAwake();
  await openStream();
  connectAsCamera(code);
}

async function openStream(){
  try{
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width:{ideal:640}, height:{ideal:480}, frameRate:{ideal:15,max:20} },
      audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:true }
    });
    setCamStatus("ok", "カメラは動いています");
  }catch(err){
    setCamStatus("bad", "カメラを使えません。ブラウザの権限を確認してください");
  }
}

function connectAsCamera(code){
  camPeer = new Peer(NS + code, { debug:0 });
  camPeer.on("open", () => setCamStatus("ok", "接続待ちです"));
  camPeer.on("connection", conn => {
    conn.on("data", data => {
      if (data && data.type === "hello" && camStream) {
        const call = camPeer.call(data.peerId, camStream);
        viewers.set(data.peerId, call);
        setCamStatus("ok", "見る側とつながりました（" + viewers.size + "台）");
      }
    });
    conn.on("close", () => {
      viewers.delete(conn.peer);
      setCamStatus("ok", viewers.size ? "つながっています（" + viewers.size + "台）" : "接続待ちです");
    });
  });
  camPeer.on("error", e => {
    if (e.type === "unavailable-id") setCamStatus("bad", "番号が重複しました。ページを再読み込みしてください");
    else setCamStatus("bad", "通信が不安定です。自動で再接続を試みます");
  });
  camPeer.on("disconnected", () => {
    setCamStatus("bad", "再接続しています");
    setTimeout(() => { try{ camPeer.reconnect(); }catch(e){} }, 1500);
  });
}

function setCamStatus(kind, msg){
  $("camStat").textContent = msg;
  $("camDot").className = "dot " + (kind === "ok" ? "ok" : "bad");
  $("breath").className = (kind === "ok" ? "" : "bad");
}

$("pickCam").onclick = startCamera;
$("pickMon").onclick = () => { show("joinScreen"); $("codeIn").focus(); };

$("camSwitch").onclick = async () => {
  facing = (facing === "environment") ? "user" : "environment";
  await openStream();
  /* 既につながっている相手に新しい映像を差し替える */
  viewers.forEach(call => {
    const sender = call.peerConnection && call.peerConnection.getSenders()
      .find(s => s.track && s.track.kind === "video");
    if (sender) sender.replaceTrack(camStream.getVideoTracks()[0]);
  });
};

$("camDark").onclick = () => $("darkveil").classList.add("on");
$("darkveil").ondblclick = () => $("darkveil").classList.remove("on");

/* ================= 見る側 ================= */
let monPeer = null, monConn = null, audioCtx = null, rafId = null;

$("joinGo").onclick = () => {
  const code = ($("codeIn").value || "").trim().toUpperCase();
  if (code.length !== 6) { setJoinStatus("bad", "6文字を入力してください"); return; }
  setJoinStatus("", "つないでいます");
  $("joinGo").disabled = true;
  joinRoom(code);
};
$("codeIn").addEventListener("keydown", e => { if (e.key === "Enter") $("joinGo").click(); });

function joinRoom(code){
  monPeer = new Peer({ debug:0 });

  const failTimer = setTimeout(() => {
    setJoinStatus("bad", "見つかりません。番号と、カメラ側が開いたままかを確認してください");
    $("joinGo").disabled = false;
    try{ monPeer.destroy(); }catch(e){}
  }, 12000);

  monPeer.on("open", myId => {
    monConn = monPeer.connect(NS + code, { reliable:true });
    monConn.on("open", () => monConn.send({ type:"hello", peerId: myId }));
    monConn.on("error", () => {});
  });

  monPeer.on("call", call => {
    clearTimeout(failTimer);
    call.answer();
    call.on("stream", stream => {
      $("remote").srcObject = stream;
      $("remote").play().catch(()=>{});
      show("monScreen");
      keepAwake();
      startMeter(stream);
      setMonStatus("ok", "つながっています");
    });
    call.on("close", () => setMonStatus("bad", "カメラ側が切断しました"));
  });

  monPeer.on("error", e => {
    clearTimeout(failTimer);
    setJoinStatus("bad", e.type === "peer-unavailable"
      ? "その番号のカメラが見つかりません"
      : "接続できませんでした。通信環境を確認してください");
    $("joinGo").disabled = false;
  });

  monPeer.on("disconnected", () => setMonStatus("bad", "再接続しています"));
}

function setJoinStatus(kind, msg){
  $("joinStat").textContent = msg;
  $("joinDot").className = "dot " + (kind === "ok" ? "ok" : kind === "bad" ? "bad" : "");
}
function setMonStatus(kind, msg){
  $("monStat").textContent = msg;
  $("monDot").className = "dot " + (kind === "ok" ? "ok" : "bad");
}

/* 音量メーター：画面を見ていなくても、視界の端で泣き出しに気づけるように */
function startMeter(stream){
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    const buf = new Uint8Array(analyser.frequencyBinCount);
    const fill = $("meterFill");

    (function tick(){
      analyser.getByteFrequencyData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i];
      const level = Math.min(100, (sum / buf.length) * 2.2);
      fill.style.width = level + "%";
      fill.classList.toggle("loud", level > 45);
      rafId = requestAnimationFrame(tick);
    })();
  }catch(e){ /* メーターが動かなくても映像には影響しない */ }
}

$("muteBtn").onclick = () => {
  const v = $("remote");
  v.muted = !v.muted;
  $("muteBtn").textContent = v.muted ? "音を出す" : "音を消す";
};

$("endBtn").onclick = () => {
  if (rafId) cancelAnimationFrame(rafId);
  if (audioCtx) audioCtx.close().catch(()=>{});
  try{ monPeer.destroy(); }catch(e){}
  $("remote").srcObject = null;
  $("joinGo").disabled = false;
  setJoinStatus("", "待機中");
  show("joinScreen");
};

/* 誤操作で見守りが止まらないように、閉じる前に確認する */
window.addEventListener("beforeunload", e => {
  if (camStream || $("remote").srcObject) { e.preventDefault(); e.returnValue = ""; }
});
</script>
</body>
</html>
